version: '3.8'
services:
  db:
    image: postgres:17-bookworm
    container_name: lumira-postgres-dev
    restart: 'no'
    mem_limit: 1024m
    cpus: '1.0'
    shm_size: 128m
    environment:
      POSTGRES_USER: lumira_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      TZ: UTC
    volumes:
    - ./data:/var/lib/postgresql/data
    - ./sql:/docker-entrypoint-initdb.d:ro
    - ./secrets/db_admin_password:/run/secrets/db_admin_password:ro
    command:
    - postgres
    - -c
    - max_connections=20
    - -c
    - shared_buffers=128MB
    - -c
    - password_encryption=scram-sha-256
    - -c
    - timezone=UTC
    - -c
    - log_statement=none
    - -c
    - log_min_duration_statement=-1
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lumira_admin -d postgres
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
    - db_private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  db_private:
    internal: true
