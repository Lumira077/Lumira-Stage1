<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect width="1280" height="820" fill="#f4f7fb"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#486482"/></marker></defs><text x="40" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#14344e">Wheel motors | Signal and power are separate</text><text x="40" y="86" font-family="sans-serif" font-size="18" fill="#486482">Logical terminal names only. Driver model, pin numbering, current limits and voltage must be confirmed.</text><polyline points="340,185 470,185" fill="none" stroke="#ae4937" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="175" font-family="sans-serif" font-size="17" fill="#ae4937">Power</text><polyline points="635,245 635,385" fill="none" stroke="#ae4937" stroke-width="3" marker-end="url(#arrow)"/><text x="655" y="310" font-family="sans-serif" font-size="17" fill="#ae4937">Protected motor rail</text><polyline points="340,445 470,445" fill="none" stroke="#226080" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="432" font-family="sans-serif" font-size="17" fill="#226080">Control</text><polyline points="800,445 930,445" fill="none" stroke="#ae4937" stroke-width="3" marker-end="url(#arrow)"/><text x="815" y="432" font-family="sans-serif" font-size="17" fill="#ae4937">Motor leads</text><polyline points="1075,535 1075,625 190,625 190,535" fill="none" stroke="#226080" stroke-width="3" marker-end="url(#arrow)"/><text x="335" y="652" font-family="sans-serif" font-size="17" fill="#226080">Encoder feedback to MCU; separate from motor-current return</text><rect x="40" y="130" width="300" height="115" rx="14" fill="white" stroke="#ae4937" stroke-width="2"/><text x="58" y="162" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ae4937">Bench DC / battery</text><text x="58" y="190" font-family="sans-serif" font-size="16" fill="#34485c">Motor-rated supply</text><text x="58" y="213" font-family="sans-serif" font-size="16" fill="#34485c">Voltage and current TBD</text><rect x="470" y="130" width="330" height="115" rx="14" fill="white" stroke="#ae4937" stroke-width="2"/><text x="488" y="162" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ae4937">Fuse + hardware inhibit</text><text x="488" y="190" font-family="sans-serif" font-size="16" fill="#34485c">Near-source protection</text><text x="488" y="213" font-family="sans-serif" font-size="16" fill="#34485c">E-stop design / manual reset</text><rect x="40" y="385" width="300" height="150" rx="14" fill="white" stroke="#226080" stroke-width="2"/><text x="58" y="417" font-family="sans-serif" font-size="21" font-weight="bold" fill="#226080">UNO-A</text><text x="58" y="445" font-family="sans-serif" font-size="16" fill="#34485c">PWM + DIR or IN1/IN2</text><text x="58" y="468" font-family="sans-serif" font-size="16" fill="#34485c">Encoder A/B inputs</text><text x="58" y="491" font-family="sans-serif" font-size="16" fill="#34485c">Default driver inhibit</text><rect x="470" y="385" width="330" height="150" rx="14" fill="white" stroke="#267264" stroke-width="2"/><text x="488" y="417" font-family="sans-serif" font-size="21" font-weight="bold" fill="#267264">Motor driver channels</text><text x="488" y="445" font-family="sans-serif" font-size="16" fill="#34485c">Logic voltage compatible</text><text x="488" y="468" font-family="sans-serif" font-size="16" fill="#34485c">VM / OUT / fault feedback</text><text x="488" y="491" font-family="sans-serif" font-size="16" fill="#34485c">Current + thermal capability</text><rect x="930" y="385" width="290" height="150" rx="14" fill="white" stroke="#267264" stroke-width="2"/><text x="948" y="417" font-family="sans-serif" font-size="21" font-weight="bold" fill="#267264">Left + right wheels</text><text x="948" y="445" font-family="sans-serif" font-size="16" fill="#34485c">One motor per channel</text><text x="948" y="468" font-family="sans-serif" font-size="16" fill="#34485c">Supported test stand</text><text x="948" y="491" font-family="sans-serif" font-size="16" fill="#34485c">Encoders if fitted</text><text x="40" y="740" font-family="sans-serif" font-size="18" fill="#8b3c20">Non-isolated logic needs a common reference ground at the distribution point.</text><text x="40" y="767" font-family="sans-serif" font-size="18" fill="#8b3c20">Do not route motor current through the Pi/UNO board or USB ground wiring.</text><text x="40" y="794" font-family="sans-serif" font-size="18" fill="#8b3c20">Stop mode (coast/brake) and EN polarity depend on the selected driver.</text></svg>