<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect width="1280" height="820" fill="#f4f7fb"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#486482"/></marker></defs><text x="40" y="52" font-family="sans-serif" font-size="30" font-weight="bold" fill="#14344e">Joint motors | DYNAMIXEL or PWM servo</text><text x="40" y="86" font-family="sans-serif" font-size="18" fill="#486482">Choose the interface and power rail for each exact actuator model before connecting.</text><polyline points="380,200 480,200" fill="none" stroke="#226080" stroke-width="3" marker-end="url(#arrow)"/><text x="405" y="188" font-family="sans-serif" font-size="17" fill="#226080">UART</text><polyline points="810,200 910,200" fill="none" stroke="#226080" stroke-width="3" marker-end="url(#arrow)"/><text x="840" y="188" font-family="sans-serif" font-size="17" fill="#226080">Bus</text><polyline points="645,435 645,340 980,340 980,265" fill="none" stroke="#ae4937" stroke-width="3" marker-end="url(#arrow)"/><text x="720" y="325" font-family="sans-serif" font-size="17" fill="#ae4937">Model-rated power</text><polyline points="480,500 380,500" fill="none" stroke="#ae4937" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="488" font-family="sans-serif" font-size="17" fill="#ae4937">Power</text><polyline points="1075,435 1075,265" fill="none" stroke="#226080" stroke-width="3" marker-end="url(#arrow)"/><text x="1085" y="365" font-family="sans-serif" font-size="17" fill="#226080">Alternate data path</text><rect x="40" y="135" width="340" height="130" rx="14" fill="white" stroke="#226080" stroke-width="2"/><text x="58" y="167" font-family="sans-serif" font-size="21" font-weight="bold" fill="#226080">UNO-B</text><text x="58" y="195" font-family="sans-serif" font-size="16" fill="#34485c">USB from Pi</text><text x="58" y="218" font-family="sans-serif" font-size="16" fill="#34485c">UART TX/RX + direction control</text><text x="58" y="241" font-family="sans-serif" font-size="16" fill="#34485c">or dedicated servo output</text><rect x="480" y="135" width="330" height="130" rx="14" fill="white" stroke="#267264" stroke-width="2"/><text x="498" y="167" font-family="sans-serif" font-size="21" font-weight="bold" fill="#267264">Bus interface</text><text x="498" y="195" font-family="sans-serif" font-size="16" fill="#34485c">TTL half-duplex OR RS-485</text><text x="498" y="218" font-family="sans-serif" font-size="16" fill="#34485c">Voltage-compatible transceiver</text><text x="498" y="241" font-family="sans-serif" font-size="16" fill="#34485c">One active bus master</text><rect x="910" y="135" width="330" height="130" rx="14" fill="white" stroke="#267264" stroke-width="2"/><text x="928" y="167" font-family="sans-serif" font-size="21" font-weight="bold" fill="#267264">DYNAMIXEL chain</text><text x="928" y="195" font-family="sans-serif" font-size="16" fill="#34485c">Unique ID for every actuator</text><text x="928" y="218" font-family="sans-serif" font-size="16" fill="#34485c">Common protocol / baud rate</text><text x="928" y="241" font-family="sans-serif" font-size="16" fill="#34485c">Model-specific control table</text><rect x="480" y="435" width="330" height="145" rx="14" fill="white" stroke="#ae4937" stroke-width="2"/><text x="498" y="467" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ae4937">Protected joint supply</text><text x="498" y="495" font-family="sans-serif" font-size="16" fill="#34485c">Fuse / inhibit / current limit</text><text x="498" y="518" font-family="sans-serif" font-size="16" fill="#34485c">Separate rail per voltage class</text><text x="498" y="541" font-family="sans-serif" font-size="16" fill="#34485c">No power from USB adapter</text><rect x="40" y="435" width="340" height="145" rx="14" fill="white" stroke="#226080" stroke-width="2"/><text x="58" y="467" font-family="sans-serif" font-size="21" font-weight="bold" fill="#226080">Optional PWM servos</text><text x="58" y="495" font-family="sans-serif" font-size="16" fill="#34485c">Signal from MCU/controller</text><text x="58" y="518" font-family="sans-serif" font-size="16" fill="#34485c">Separate servo supply</text><text x="58" y="541" font-family="sans-serif" font-size="16" fill="#34485c">No fixed pulse range assumed</text><rect x="910" y="435" width="330" height="145" rx="14" fill="white" stroke="#226080" stroke-width="2"/><text x="928" y="467" font-family="sans-serif" font-size="21" font-weight="bold" fill="#226080">Commissioning option</text><text x="928" y="495" font-family="sans-serif" font-size="16" fill="#34485c">PC/Pi + U2D2</text><text x="928" y="518" font-family="sans-serif" font-size="16" fill="#34485c">Replace normal bus master</text><text x="928" y="541" font-family="sans-serif" font-size="16" fill="#34485c">Do not drive from two masters</text><text x="40" y="740" font-family="sans-serif" font-size="18" fill="#8b3c20">Support arms/head before torque-off: the mechanism may fall under gravity.</text><text x="40" y="767" font-family="sans-serif" font-size="18" fill="#8b3c20">Example: XL330-M288-T is 3.7–6.0V (5.0V recommended), NOT a 12V actuator.</text><text x="40" y="794" font-family="sans-serif" font-size="18" fill="#8b3c20">Connector orientation and wire colors must be checked against the exact model manual.</text></svg>