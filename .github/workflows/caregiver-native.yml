name: Caregiver R4 native builds
on:
  push:
    branches: [lumira-caregiver-r4-native-build]
    paths: ['caregiver/**', '.github/workflows/caregiver-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caregiver-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: caregiver/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci && npm run sync && npm run check
      - run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: caregiver-r4-android-debug
          path: caregiver/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: caregiver/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: xcodebuild -version
      - run: npm ci && npm run sync && npm run check
      - name: Compile iPhone device application without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned build for signing handoff
        run: |
          mkdir -p build/unsigned/Payload
          cp -R build/ios-device/Build/Products/Debug-iphoneos/App.app build/unsigned/Payload/
          cd build/unsigned && ditto -c -k --keepParent Payload ../Lumira-Caregiver-R4-UNSIGNED-NOT-INSTALLABLE.ipa
      - name: Compile and launch on iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device_id" kr.lumira.caregiver.dev
          sleep 5
          xcrun simctl io "$device_id" screenshot build/ios-simulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caregiver-r4-ios-unsigned-and-simulator
          path: |
            caregiver/mobile/build/*.ipa
            caregiver/mobile/build/ios-simulator.png
          retention-days: 3
