name: Epic 01-17 offline verification
on:
  push:
    paths:
      - 'Development/**'
      - 'scripts/**'
      - 'Epic-07/**'
      - 'Epic-08/**'
      - 'Epic-09/**'
      - 'Epic-10/**'
      - 'Epic-11/**'
      - 'Epic-12/**'
      - 'Epic-13/**'
      - 'Epic-14/**'
      - 'Epic-15/**'
      - 'Epic-16/**'
      - 'Epic-17/**'
      - 'Epic-18/**'
      - 'Epic-19/**'
      - 'Epic-20/**'
      - '.github/workflows/development-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All offline suites and contracts
        run: python scripts/verify_all.py
      - name: Stage1 and design simulations
        run: |
          python Development/Stage1/mock_transport.py
          python Development/Stage1/bringup/probe.py --mode simulate
          python Epic-17/runtime/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-batch-evidence
          path: |
            artifacts/verification/
            Development/evidence/report.json
            Epic-01/integration/evidence/report.json
            Epic-02/runtime/evidence/report.json
            Epic-03/runtime/evidence/report.json
            Epic-04/runtime/evidence/report.json
            Epic-05/runtime/evidence/report.json
            Epic-06/runtime/evidence/report.json
